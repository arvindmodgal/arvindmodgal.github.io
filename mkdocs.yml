              - Upload firmware: portfolio/firmwarecheck/manage-firmware/upload-firmware.md
              - Replace firmware: portfolio/firmwarecheck/manage-firmware/replace-firmware.md
          - Run assessments:
              - Overview: portfolio/firmwarecheck/run-assessments/index.md
              - Assessment types: portfolio/firmwarecheck/run-assessments/assessment-types.md
