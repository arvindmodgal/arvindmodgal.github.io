---
site_name: Arvind Modgal — Technical Writer
site_url: https://arvindmodgal.github.io
site_description: >
  Senior Technical Writer with 15+ years in cybersecurity,
  fintech, and enterprise software documentation
site_author: Arvind Modgal

# Fix directory URL issues
use_directory_urls: false

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: deep orange
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: amber
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  font:
    text: Inter
    code: JetBrains Mono
  features:
    - navigation.path          # ← BREADCRUMBS RESTORED
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.tabs.link
    - content.code.copy
    - content.code.annotate
  icon:
    logo: material/file-document-edit

extra_css:
  - stylesheets/extra.css

extra:
  social:
    - icon: fontawesome/brands/linkedin
      link: https://www.linkedin.com/in/arvind-modgal-3705441ba
    - icon: fontawesome/brands/github
      link: https://github.com/arvindmodgal
    - icon: fontawesome/solid/envelope
      link: mailto:arvind.modgal@outlook.com

plugins:
  - search

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.keys
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
      toc_depth: 3
  - pymdownx.tasklist:
      custom_checkbox: true

nav:
  - Home: index.md
  - Resume: resume.md
  - Work samples:
      - Overview: samples/index.md
      - API documentation: samples/api-docs/index.md
      - Style guide: samples/style-guide/index.md
      - FirmwareCheck user guide: samples/user-guide/index.md
      - Getting started: samples/user-guide/getting-started.md
      - Managing devices: samples/user-guide/managing-devices.md
      - Assessments: samples/user-guide/assessments.md
      - Jira integration: samples/user-guide/jira-integration.md