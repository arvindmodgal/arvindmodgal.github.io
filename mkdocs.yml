      - OTA Server Sample: portfolio/ota-server-sample/index.md         
      - Style Guide:
          - Overview: portfolio/style-guide/index.md
          - Writing Principles: portfolio/style-guide/writing-principles.md
          - Voice and Tone: portfolio/style-guide/voice-and-tone.md
          - Common Writing Issues: portfolio/style-guide/common-mistakes.md
          - Terminology: portfolio/style-guide/terminology.md
          - Procedures: portfolio/style-guide/procedures.md
