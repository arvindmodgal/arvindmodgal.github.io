---
site_name: Arvind Modgal — Technical Writer
site_url: https://arvindmodgal.github.io
site_description: >
  Senior Technical Writer with 15+ years in cybersecurity,
  fintech, and enterprise software documentation
site_author: Arvind Modgal
use_directory_urls: false

theme:
  name: material
  custom_dir: overrides
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: deep orange
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: amber
      toggle:
        icon: material/brightness-7
        name: Switch to light mode
  font:
    text: Inter
    code: JetBrains Mono
  features:
    - navigation.path
    # - navigation.sections
    - navigation.indexes
    # - navigation.instant
    - navigation.top
    - toc.follow
    - search.suggest
    - search.highlight
    - content.tabs.link
    - content.code.copy
    - content.code.annotate
  icon:
    logo: material/file-document-edit

extra_css:
  #   - assets/css/extra.css
  - assets/css/landing.css
  - assets/css/newspaper.css
  - assets/css/style-guide.css

extra:
  social:
    - icon: fontawesome/brands/linkedin
      link: https://www.linkedin.com/in/arvind-modgal-3705441ba
    - icon: fontawesome/brands/github
      link: https://github.com/arvindmodgal
    - icon: fontawesome/solid/envelope
      link: mailto:arvind.modgal@outlook.com

plugins:
  - search

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.keys
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
      toc_depth: 3
  - pymdownx.tasklist:
      custom_checkbox: true

nav:
  - 🏠 Home: index.md
  # - 📋 Resume: resume/index.md
  - 📋 Resume: resume.md
  - 📁 Portfolio:
      - Overview: portfolio/index.md
      - FirmwareCheck User Guide:
          - Overview: portfolio/firmwarecheck/index.md
          - Documentation Approach: portfolio/firmwarecheck/documentation-approach.md
          - About FirmwareCheck: portfolio/firmwarecheck/about-firmwarecheck.md
          - Getting Started: portfolio/firmwarecheck/getting-started.md
          - Manage Your Account: portfolio/firmwarecheck/manage-your-account.md
          - Manage Users: portfolio/firmwarecheck/manage-users.md
          # - Manage Devices: portfolio/firmwarecheck/manage-devices.md
          - Manage devices:
              - Overview: portfolio/firmwarecheck/manage-devices/index.md
              - What is a device?: portfolio/firmwarecheck/manage-devices/what-is-a-device.md
              - Device status: portfolio/firmwarecheck/manage-devices/device-status.md
              - Create a device: portfolio/firmwarecheck/manage-devices/create-a-device.md
              - Find a device: portfolio/firmwarecheck/manage-devices/find-a-device.md
              - Update device information: portfolio/firmwarecheck/manage-devices/update-device-information.md
              - Archive a device: portfolio/firmwarecheck/manage-devices/archive-a-device.md
              - Delete a device: portfolio/firmwarecheck/manage-devices/delete-a-device.md
          # - Manage Assessments: portfolio/firmwarecheck/manage-assessments.md
          - Manage firmware:
